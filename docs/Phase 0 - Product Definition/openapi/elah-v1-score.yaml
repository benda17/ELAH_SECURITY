openapi: 3.1.0
info:
  title: ELAH Scoring API — Input and Output Contract
  version: "1.0"
  description: |
    Pre-tool scoring handoff from the banking simulator to ELAH.
    Request wrapper is ScoreRequest; event body is ElahEvent 1.0
    (ELAH-SPEC-EVENT-001). Success body is ScoreResponse / ElahScore
    (ELAH-SPEC-OUTPUT-001). Errors and fail-open remain as specified
    in the input contract.
  contact:
    name: ELAH Security
servers:
  - url: https://elah.example.internal
    description: Replace with the ELAH service base URL when deployed.
security:
  - bearerAuth: []
tags:
  - name: Score
    description: Synchronous pre-tool intention scoring
paths:
  /v1/score:
    post:
      tags: [Score]
      operationId: scorePreTool
      summary: Score an ElahEvent before tool execution
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: If present, MUST equal requestId in the body.
        - name: X-Elah-App-Id
          in: header
          required: false
          schema:
            type: string
          description: If present, MUST equal event.appId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreRequest"
            examples:
              p0ExternalTransfer:
                summary: Valid P0 external transfer (pre-tool)
                value:
                  contractVersion: "1.0"
                  requestId: req_01JEXAMPLE_SCORE_001
                  mode: pre_tool
                  event:
                    schemaVersion: "1.0"
                    eventId: evt_01JEXAMPLE000000000000001
                    occurredAt: "2026-08-17T07:12:04.120Z"
                    appId: elah-banking-demo
                    source: agent
                    actionType: external_transfer
                    outcome: pending_confirmation
                    executionState: pre_tool
                    actor:
                      userIdHash: a1b2c3d4e5f60718293a4b5c6d7e8f90
                      sessionId: clxsessionexample0001
                      actorType: customer
                      role: premium_customer
                      customerTier: premium
                    action:
                      toolName: create_external_transfer
                      page: /assistant
                      args:
                        recipientName: "[recipient_redacted]"
                        amount: 500
                        note: rent
                      amount: 500
                      currency: ILS
                      amountBucket: medium_500_1999
                      accountContext: checking
                      recipientType: person_name
                    policy:
                      decision: needs_confirmation
                      reasons:
                        - "tool 'create_external_transfer' requires explicit user confirmation"
                      confirmationRequired: true
                    conversation:
                      conversationId: clxconvexample0001
                      messageId: clxmsgexample0001
                      utterance: Send 500 shekels to Daniel
                    mfaStatus: unknown
                    detectedIntent: external_transfer
              extraProperty:
                summary: Invalid — score leaked onto the request
                value:
                  contractVersion: "1.0"
                  requestId: req_bad
                  mode: pre_tool
                  event: {}
                  elahScore: 0.5
      responses:
        "200":
          description: Event accepted and scored (or abstained). Full ElahScore is always present.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResponse"
              examples:
                p0ExternalTransfer:
                  $ref: "#/components/examples/ScoredExternalTransfer"
                promptInjection:
                  $ref: "#/components/examples/ScoredInjection"
                abstained:
                  $ref: "#/components/examples/AbstainedAmbiguous"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Simulator service token. Not a user session cookie.
  responses:
    Error400:
      description: Malformed wrapper JSON or additional properties.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            contractVersion: "1.0"
            requestId: req_bad
            error:
              code: additional_properties
              message: Unknown top-level field.
    Error401:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error403:
      description: Token not allowed for this appId.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error409:
      description: Idempotency key reused with a different body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error413:
      description: Body larger than 32768 bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error422:
      description: Semantic validation failed (event schema, mode, sanitization).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            wrongExecutionState:
              value:
                contractVersion: "1.0"
                requestId: req_01JEXAMPLE_SCORE_001
                error:
                  code: wrong_execution_state
                  message: POST /v1/score does not accept post_tool events.
            sanitizationFailed:
              value:
                contractVersion: "1.0"
                requestId: req_01JEXAMPLE_SCORE_001
                error:
                  code: sanitization_failed
                  message: Forbidden or unredacted fields in event.action.args.
                  details:
                    - path: event.action.args.userId
                      reason: forbidden_key
    Error429:
      description: Reserved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error500:
      description: Internal error. Caller MUST fail open.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error503:
      description: Unavailable. Caller MUST fail open.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  examples:
    ScoredExternalTransfer:
      summary: Valid P0 external transfer (scored, watch)
      value:
        contractVersion: "1.0"
        requestId: req_01JEXAMPLE_SCORE_001
        eventId: evt_01JEXAMPLE000000000000001
        status: scored
        scoredAt: "2026-08-17T07:12:04.310Z"
        score:
          elahScore: 0.87
          confidence: 0.82
          uncertainty: 0.18
          intentLabel: external_transfer
          coordinates:
            humanAgency: 0.72
            financialRisk: 0.78
            emotionalUrgency: 0.35
          explanation:
            matchedSignals:
              - transfer_or_payment_verb
              - amount_detected
              - recipient_detected
              - planned_tool:create_external_transfer
              - banking_action_context
            weakSignals: []
            negativeSignals: []
            summary: Planned external transfer of a medium amount to a named recipient; looks like genuine payment intent.
          policyHook:
            recommendation: watch
            reasons:
              - P0 money movement with financialRisk 0.78; bank confirmation already required.
          provenance:
            scorer: rules_v0
            modelVersion: null
            labelSource: rules_v0
    ScoredInjection:
      summary: Valid injection (low score, review)
      value:
        contractVersion: "1.0"
        requestId: req_01JEXAMPLE_SCORE_002
        eventId: evt_01JEXAMPLE000000000000003
        status: scored
        scoredAt: "2026-08-17T07:14:11.002Z"
        score:
          elahScore: 0.08
          confidence: 0.91
          uncertainty: 0.09
          intentLabel: prompt_injection_or_policy_bypass
          coordinates:
            humanAgency: 0.15
            financialRisk: 0.92
            emotionalUrgency: 0.25
          explanation:
            matchedSignals: []
            weakSignals: []
            negativeSignals:
              - ignore_previous_instructions
              - policy_or_refusal_outcome
            summary: Hostile instruction to override policy; not genuine banking intent.
          policyHook:
            recommendation: review
            reasons:
              - intentLabel is prompt_injection_or_policy_bypass
          provenance:
            scorer: intent_matrix
            modelVersion: null
            labelSource: intent_matrix
    AbstainedAmbiguous:
      summary: Valid abstention (full score still present)
      value:
        contractVersion: "1.0"
        requestId: req_01JEXAMPLE_SCORE_003
        eventId: evt_01JEXAMPLE000000000000010
        status: abstained
        scoredAt: "2026-08-17T07:20:00.000Z"
        score:
          elahScore: 0.48
          confidence: 0.31
          uncertainty: 0.69
          intentLabel: ambiguous_banking_request
          coordinates:
            humanAgency: 0.35
            financialRisk: 0.25
            emotionalUrgency: 0.3
          explanation:
            matchedSignals:
              - transfer_or_payment_verb
            weakSignals:
              - short_message
              - question_without_tool_plan
            negativeSignals: []
            summary: Payment verb without amount, recipient, or planned tool; score withheld as decisive.
          policyHook:
            recommendation: review
            reasons:
              - status is abstained
          provenance:
            scorer: rules_v0
            modelVersion: null
            labelSource: rules_v0
  schemas:
    ScoreRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, requestId, mode, event]
      properties:
        contractVersion:
          type: string
          const: "1.0"
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        mode:
          type: string
          const: pre_tool
        event:
          $ref: "#/components/schemas/ElahEvent"
    ScoreResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, requestId, eventId, status, scoredAt, score]
      properties:
        contractVersion:
          type: string
          const: "1.0"
        requestId:
          type: string
        eventId:
          type: string
        status:
          type: string
          enum: [scored, abstained]
        scoredAt:
          type: string
          format: date-time
        score:
          $ref: "#/components/schemas/ElahScore"
    ElahScore:
      type: object
      additionalProperties: false
      required:
        - elahScore
        - confidence
        - uncertainty
        - intentLabel
        - coordinates
        - explanation
        - policyHook
        - provenance
      properties:
        elahScore:
          type: number
          minimum: 0
          maximum: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        uncertainty:
          type: number
          minimum: 0
          maximum: 1
          description: MUST equal round3(1 - confidence) within 0.001.
        intentLabel:
          $ref: "#/components/schemas/ElahBankingIntent"
        coordinates:
          $ref: "#/components/schemas/IntentionCoordinates"
        explanation:
          $ref: "#/components/schemas/ElahExplanation"
        policyHook:
          $ref: "#/components/schemas/PolicyHook"
        provenance:
          $ref: "#/components/schemas/ScoreProvenance"
    ElahBankingIntent:
      type: string
      enum:
        - balance_awareness
        - recent_transactions
        - spending_summary
        - internal_transfer
        - external_transfer
        - bill_payment
        - scheduled_payment
        - statement_download
        - card_freeze
        - card_unfreeze
        - fraud_report
        - dispute_chargeback
        - fee_or_overdraft_question
        - loan_inquiry
        - loan_application
        - savings_optimization
        - profile_update
        - support_escalation
        - ambiguous_banking_request
        - non_banking_request
        - prompt_injection_or_policy_bypass
    IntentionCoordinates:
      type: object
      additionalProperties: false
      required: [humanAgency, financialRisk, emotionalUrgency]
      properties:
        humanAgency:
          type: number
          minimum: 0
          maximum: 1
        financialRisk:
          type: number
          minimum: 0
          maximum: 1
        emotionalUrgency:
          type: number
          minimum: 0
          maximum: 1
    ElahExplanation:
      type: object
      additionalProperties: false
      required: [matchedSignals, weakSignals, negativeSignals]
      properties:
        matchedSignals:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 128
        weakSignals:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 128
        negativeSignals:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 128
        summary:
          type: string
          maxLength: 240
    PolicyHook:
      type: object
      additionalProperties: false
      required: [recommendation, reasons]
      properties:
        recommendation:
          type: string
          enum: [none, watch, review, step_up_hint]
          description: Recommendation only. allow/deny/confirm are forbidden.
        reasons:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 160
    ScoreProvenance:
      type: object
      additionalProperties: false
      required: [scorer, modelVersion, labelSource]
      properties:
        scorer:
          type: string
          enum: [rules_v0, intent_matrix, model, hybrid, manual]
        modelVersion:
          type: ["string", "null"]
        labelSource:
          type: string
          enum: [rules_v0, intent_matrix, backfill, manual]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, error]
      properties:
        contractVersion:
          type: string
          const: "1.0"
        requestId:
          type: ["string", "null"]
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_json
                - additional_properties
                - missing_field
                - unauthorized
                - forbidden_app
                - idempotency_conflict
                - payload_too_large
                - unsupported_contract_version
                - unsupported_mode
                - event_schema_violation
                - sanitization_failed
                - wrong_execution_state
                - app_id_mismatch
                - rate_limited
                - internal_error
                - unavailable
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [path, reason]
                properties:
                  path:
                    type: string
                  reason:
                    type: string
    ElahEvent:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - eventId
        - occurredAt
        - appId
        - source
        - actionType
        - outcome
        - executionState
        - actor
        - action
      properties:
        schemaVersion:
          type: string
          const: "1.0"
        eventId:
          type: string
          minLength: 8
        occurredAt:
          type: string
          format: date-time
        appId:
          type: string
        source:
          type: string
          enum: [ui, agent, system]
        actionType:
          type: string
        outcome:
          type: string
          enum:
            - executed
            - blocked
            - cancelled
            - failed
            - pending_confirmation
            - conversational
            - refused
            - session
        executionState:
          type: string
          enum: [pre_tool, post_tool, no_tool]
        detectedIntent:
          type: string
        mfaStatus:
          type: string
          enum: [unknown, not_enabled, passed, failed, skipped]
        actor:
          type: object
          additionalProperties: false
          required: [actorType]
          properties:
            userIdHash:
              type: ["string", "null"]
            sessionId:
              type: ["string", "null"]
            actorType:
              type: string
              enum: [customer, manager, admin, ai_agent, anonymous]
            role:
              type: ["string", "null"]
            customerTier:
              type: ["string", "null"]
              enum: [basic, premium, vip, not_applicable]
        client:
          type: object
          additionalProperties: false
          properties:
            ipAddress:
              type: ["string", "null"]
            userAgent:
              type: ["string", "null"]
              maxLength: 400
        action:
          type: object
          additionalProperties: false
          required: [args, amountBucket, accountContext, recipientType]
          properties:
            toolName:
              type: ["string", "null"]
            page:
              type: ["string", "null"]
            args:
              type: object
            amount:
              type: ["number", "null"]
            currency:
              type: ["string", "null"]
              enum: [ILS]
            amountBucket:
              type: string
            accountContext:
              type: string
            recipientType:
              type: string
        policy:
          type: object
          additionalProperties: false
          required: [decision, reasons, confirmationRequired]
          properties:
            decision:
              type: string
              enum: [allow, deny, needs_confirmation, not_applicable]
            reasons:
              type: array
              items:
                type: string
            confirmationRequired:
              type: boolean
        conversation:
          type: object
          additionalProperties: false
          required: [conversationId, messageId]
          properties:
            conversationId:
              type: string
            messageId:
              type: string
            utterance:
              type: ["string", "null"]
              maxLength: 2000
```
